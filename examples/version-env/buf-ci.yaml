# This workflow downloads the version of buf specified in the env var $BUF_VERSION.
name: Buf CI
on:
  push:
permissions:
  contents: read
env:
  BUF_VERSION: "1.72.0"
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf version

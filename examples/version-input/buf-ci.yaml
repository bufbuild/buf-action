# This workflow downloads the version of buf specified in the action input.
name: Buf CI
on:
  push:
permissions:
  contents: read
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.72.0
      - run: buf version
